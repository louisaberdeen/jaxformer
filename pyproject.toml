[project]
name = "jaxformer"
version = "0.1.0"
description = "From-scratch decoder-only transformer in pure JAX, trained on FineWeb-EDU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Louis Aberdeen" }]
dependencies = [
    "jax>=0.6,<0.7",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "mlflow>=3.0",
    "huggingface_hub>=0.20",
    "tokenizers>=0.15",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Documentation only -- this wheel is Linux/TPU-only and will NOT resolve on a local
# `uv sync`. On the Colab VM rely on the preinstalled jax[tpu] instead (install the
# jaxformer wheel with --no-deps so pip doesn't clobber it). See scripts/train_colab.sh.
tpu = ["jax[tpu]>=0.6,<0.7"]

[project.scripts]
jaxformer = "jaxformer.cli:main"

[dependency-groups]
# tensorboard + the profile plugin are only for viewing a pulled trace locally
# (scripts/view_trace.sh); mlflow (a runtime dep) drives scripts/view_mlflow.sh.
dev = ["pytest>=8.0", "tensorboard>=2.14", "tensorboard-plugin-profile>=2.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxformer"]
